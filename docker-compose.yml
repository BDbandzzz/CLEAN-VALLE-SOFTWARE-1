services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cleanvalle_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    networks:
      - cleanvalle_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: http://localhost:3000
    container_name: cleanvalle_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - cleanvalle_net

networks:
  cleanvalle_net:
    driver: bridge
